<section class="page-heading"><div><p class="eyebrow">Access management</p><h1>User accounts</h1><p>Invite staff, assign roles, and control access to the school portal.</p></div><button class="button button--primary" type="button" (click)="adding.set(!adding())">{{ adding() ? 'Close form' : '+ Add user' }}</button></section>
@if (adding()) { <form class="quick-form card" [formGroup]="form" (ngSubmit)="submit()"><h2>Invite a user</h2><label>Full name<input formControlName="name"></label><label>Email address<input type="email" formControlName="email"></label><label>Role<select formControlName="roleId">@for (role of settingsService.roles(); track role.id) { <option [value]="role.id">{{ role.name }}</option> }</select></label><div class="quick-form__actions"><button class="button button--secondary" type="button" (click)="adding.set(false)">Cancel</button><button class="button button--primary" type="submit">Add user</button></div></form> }
<div class="toolbar"><div class="toolbar__filters"><input type="search" placeholder="Search users…" [ngModel]="query()" (ngModelChange)="query.set($event)"><select [ngModel]="status()" (ngModelChange)="status.set($event)"><option value="All">All statuses</option><option value="Active">Active</option><option value="Suspended">Suspended</option></select></div><span class="muted">{{ users().length }} user accounts</span></div>
<section class="card table-card"><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last active</th></tr></thead><tbody>@for (user of users(); track user.id) { <tr><td><strong>{{ user.name }}</strong><br><span class="muted">{{ user.email }}</span></td><td><select [ngModel]="user.roleId" (ngModelChange)="changeRole(user.id, $event)">@for (role of settingsService.roles(); track role.id) { <option [value]="role.id">{{ role.name }}</option> }</select></td><td><select class="status-select" [class.suspended]="user.status === 'Suspended'" [ngModel]="user.status" (ngModelChange)="changeStatus(user.id, $event)"><option value="Active">Active</option><option value="Suspended">Suspended</option></select></td><td>{{ user.lastActive }}</td></tr> }</tbody></table></div></section>
