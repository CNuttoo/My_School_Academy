<section class="page-heading"><div><p class="eyebrow">School settings</p><h1>School profile</h1><p>Maintain the identity, contact details, and active academic period.</p></div><button class="button button--primary" type="button" (click)="save()">{{ saved() ? 'Changes saved ✓' : 'Save changes' }}</button></section>
<form class="profile-form card" [formGroup]="form"><div class="form-section"><div><p class="eyebrow">01</p><h2>Identity</h2><p>Official name and school administration.</p></div><div class="fields"><label>School name<input formControlName="name"></label><label>School code<input formControlName="code"></label><label>Principal<input formControlName="principal"></label><label>Timezone<select formControlName="timezone"><option>Asia/Bangkok (UTC+7)</option><option>UTC</option><option>America/New_York (UTC-5)</option></select></label></div></div><div class="form-section"><div><p class="eyebrow">02</p><h2>Contact</h2><p>Primary school office contact information.</p></div><div class="fields"><label>Email address<input type="email" formControlName="email"></label><label>Phone number<input formControlName="phone"></label><label class="wide">Address<input formControlName="address"></label></div></div><div class="form-section"><div><p class="eyebrow">03</p><h2>Academic period</h2><p>Current year and term used throughout the system.</p></div><div class="fields"><label>Academic year<input formControlName="academicYear"></label><label>Current term<select formControlName="currentTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label></div></div></form>
